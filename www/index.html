<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Brox</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; background-color: #000000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; overflow: hidden; }
        
        /* Ekranın Tam Ortasında Yer Alan Arama Alanı */
        #search-container {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            display: flex; flex-direction: column; width: 85%; max-width: 450px; gap: 15px; z-index: 10;
        }
        #url-input {
            width: 100%; height: 50px; padding: 0 20px; font-size: 18px;
            background-color: #1c1c1e; color: #f2f2f7; border: 1px solid #38383a; border-radius: 14px; outline: none; text-align: center;
        }
        #url-input:focus { border-color: #0a84ff; box-shadow: 0 0 0 2px rgba(10,132,255,0.3); }
        
        #search-btn {
            width: 100%; height: 50px; font-size: 18px; font-weight: bold;
            background-color: #0a84ff; color: #ffffff; border: none; border-radius: 14px; cursor: pointer; transition: 0.2s;
        }
        #search-btn:active { background-color: #0062d2; transform: scale(0.98); }
    </style>
</head>
<body>

    <div id="search-container">
        <input type="url" id="url-input" placeholder="Google, YouTube veya URL yazın...">
        <button id="search-btn">Ara</button>
    </div>

    <script>
        const urlInput = document.getElementById('url-input');
        const searchBtn = document.getElementById('search-btn');

        function executeSearch() {
            let query = urlInput.value.trim();
            if (!query) return;

            let finalUrl = query;
            if (!finalUrl.startsWith('http://') && !finalUrl.startsWith('https://')) {
                if (finalUrl.includes('.') && !finalUrl.includes(' ')) {
                    finalUrl = 'https://' + finalUrl;
                } else {
                    finalUrl = 'https://www.google.com/search?q=' + encodeURIComponent(finalUrl);
                }
            }

            urlInput.blur();
            
            // Android Native Java motoruna siteyi aç komutu gönder
            if (window.BroxNative && window.BroxNative.loadUrl) {
                window.BroxNative.loadUrl(finalUrl);
            }
        }

        searchBtn.addEventListener('click', executeSearch);
        urlInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') executeSearch();
        });

        // Siteden ana ekrana dönüldüğünde arama çubuğunu sıfırla
        window.resetBrowser = function() {
            urlInput.value = '';
        };
    </script>
</body>
</html>
