<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Brox Browser</title>
    <style>
        body, html {
            margin: 0; padding: 0; height: 100%;
            font-family: sans-serif; display: flex; flex-direction: column;
        }
        #toolbar {
            display: flex; padding: 10px; background-color: #f1f1f1;
            border-bottom: 1px solid #ccc;
        }
        #url-input {
            flex-grow: 1; padding: 8px; border: 1px solid #ccc;
            border-radius: 4px; margin-right: 10px; font-size: 16px;
        }
        #go-btn {
            padding: 8px 15px; background-color: #007bff; color: white;
            border: none; border-radius: 4px; font-size: 16px; cursor: pointer;
        }
        #webview {
            flex-grow: 1; border: none; width: 100%;
        }
    </style>
</head>
<body>
    <div id="toolbar">
        <input type="url" id="url-input" placeholder="URL girin..." value="https://example.com">
        <button id="go-btn">Git</button>
    </div>
    <iframe id="webview" src="https://example.com"></iframe>

    <script>
        const urlInput = document.getElementById('url-input');
        const goBtn = document.getElementById('go-btn');
        const webview = document.getElementById('webview');

        function loadUrl() {
            let url = urlInput.value.trim();
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                url = 'https://' + url;
            }
            webview.src = url;
            urlInput.value = url;
        }

        goBtn.addEventListener('click', loadUrl);
        urlInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') loadUrl();
        });
    </script>
</body>
</html>
