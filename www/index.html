<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Brox Browser</title>
    <style>
        :root {
            --bg-base: #000000; --bg-surface: #1C1C1E; --bg-hover: #2C2C2E;
            --text-main: #F2F2F7; --text-muted: #8E8E93; --primary: #0A84FF;
            --border: #38383A; --incognito: #181124; --danger: #FF453A;
        } 

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; background-color: var(--bg-base); color: var(--text-main); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; overflow: hidden; -webkit-user-select: none; user-select: none; } 

        /* Toolbar */
        #toolbar {
            display: flex; align-items: center; padding: 0 12px; height: 56px; gap: 10px;
            background-color: var(--bg-base); border-bottom: 1px solid var(--border); z-index: 10;
        }
        
        /* Geri Tuşu (Site içindeyken görünür) */
        #back-btn { display: none; background: var(--bg-surface); color: var(--primary); border: 1px solid var(--border); padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: bold; }

        .input-container {
            display: flex; flex-grow: 1; align-items: center; background-color: var(--bg-surface); border-radius: 12px; padding: 0 16px; height: 40px;
        }
        #url-input { flex-grow: 1; background: transparent; border: none; color: var(--text-main); font-size: 16px; outline: none; width: 100%; -webkit-user-select: auto; user-select: auto; }
        
        .icon-btn { background: none; border: none; color: var(--text-main); display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; cursor: pointer; border-radius: 10px; }
        .icon-btn:hover { background-color: var(--bg-hover); }
        .icon-btn svg { width: 22px; height: 22px; stroke-width: 2; } 

        #tab-counter-btn { border: 2px solid var(--text-main); border-radius: 8px; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: bold; margin: 0 4px; cursor: pointer; } 

        /* Ana Sayfa İçeriği & Kısayollar */
        #home-content { flex-grow: 1; padding: 25px; overflow-y: auto; display: flex; flex-direction: column; background: var(--bg-base); }
        .shortcuts-title { font-size: 14px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; }
        .shortcut-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(75px, 1fr)); gap: 20px; }
        .shortcut-item { display: flex; flex-direction: column; align-items: center; cursor: pointer; }
        .shortcut-icon { width: 60px; height: 60px; background-color: var(--bg-surface); border: 1px solid var(--border); border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: bold; color: var(--text-main); transition: 0.2s; }
        .shortcut-item:hover .shortcut-icon { border-color: var(--primary); }
        .shortcut-name { margin-top: 8px; font-size: 12px; color: var(--text-main); width: 100%; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } 

        /* Pull to Refresh */
        #pull-to-refresh { position: absolute; top: -50px; left: 50%; transform: translateX(-50%); width: 40px; height: 40px; background-color: var(--bg-surface); border: 1px solid var(--border); border-radius: 50%; display: flex; align-items: center; justify-content: center; z-index: 15; transition: top 0.2s; pointer-events: none; }
        .refresh-icon { font-size: 20px; color: var(--text-main); }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .spinning { animation: spin 1s linear infinite; } 

        /* Sekme Modalı */
        #tabs-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.85); z-index: 40; backdrop-filter: blur(10px); flex-direction: column; padding: 20px; box-sizing: border-box; }
        .tabs-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-size: 20px; font-weight: bold; }
        .tab-grid { display: flex; flex-wrap: wrap; gap: 15px; overflow-y: auto; }
        .tab-card { background-color: var(--bg-surface); border: 2px solid var(--border); border-radius: 12px; width: calc(50% - 8px); height: 140px; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; position: relative; }
        .tab-card.active { border-color: var(--primary); }
        .tab-card span { font-size: 14px; text-align: center; padding: 10px; word-break: break-all; }
        .close-tab-btn { position: absolute; top: 5px; right: 5px; background: rgba(255,0,0,0.2); border-radius: 50%; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; font-size: 12px; }

        #toast { visibility: hidden; min-width: 220px; background-color: var(--bg-hover); color: var(--text-main); text-align: center; border-radius: 20px; padding: 10px; position: fixed; z-index: 100; left: 50%; bottom: 40px; transform: translateX(-50%); font-size: 14px; opacity: 0; transition: opacity 0.3s; }
        #toast.show { visibility: visible; opacity: 1; }
    </style>
</head>
<body> 

    <div id="toolbar">
        <button id="back-btn" title="Geri">⬅ Geri</button>
        <button class="icon-btn" id="home-btn" title="Ana Sayfa">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        </button>
        <div class="input-container">
            <input type="url" id="url-input" placeholder="Google, YouTube veya URL yazın...">
        </div>
        <button class="icon-btn" id="add-tab-btn" title="Yeni Sekme">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        </button>
        <div id="tab-counter-btn" title="Sekmeler">1</div>
    </div> 

    <div id="tabs-modal">
        <div class="tabs-header">Açık Sekmeler <span id="close-tabs-modal" style="cursor:pointer; font-size:24px;">×</span></div>
        <div class="tab-grid" id="tab-grid-container"></div>
    </div> 

    <!-- Ana Sayfa & Kısayollar -->
    <div id="home-content">
        <div class="shortcuts-title">Sık Kullanılanlar</div>
        <div class="shortcut-grid" id="shortcut-grid"></div>
    </div> 

    <div id="pull-to-refresh"><div class="refresh-icon">↻</div></div>
    <div id="toast"></div> 

    <script>
        const urlInput = document.getElementById('url-input');
        const homeContent = document.getElementById('home-content');
        const backBtn = document.getElementById('back-btn');
        const addTabBtn = document.getElementById('add-tab-btn');
        const tabCounterBtn = document.getElementById('tab-counter-btn');
        const tabsModal = document.getElementById('tabs-modal');
        const shortcutGrid = document.getElementById('shortcut-grid');

        function showToast(msg) {
            const t = document.getElementById("toast"); t.innerText = msg;
            t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 2500);
        } 

        // Kısayollar Sistemi
        let shortcuts = JSON.parse(localStorage.getItem('brox_shortcuts')) || [
            { name: "Google", url: "https://www.google.com" },
            { name: "YouTube", url: "https://www.youtube.com" },
            { name: "Wikipedia", url: "https://www.wikipedia.org" }
        ];

        function renderShortcuts() {
            shortcutGrid.innerHTML = '';
            shortcuts.forEach(item => {
                let div = document.createElement('div');
                div.className = 'shortcut-item';
                div.innerHTML = `<div class="shortcut-icon">${item.name.charAt(0).toUpperCase()}</div><div class="shortcut-name">${item.name}</div>`;
                div.onclick = () => loadUrl(item.url);
                shortcutGrid.appendChild(div);
            });
            // Ekle Butonu
            let addDiv = document.createElement('div');
            addDiv.className = 'shortcut-item';
            addDiv.innerHTML = `<div class="shortcut-icon" style="color:var(--primary); font-size:30px;">+</div><div class="shortcut-name">Ekle</div>`;
            addDiv.onclick = () => {
                let name = prompt("Kısayol Adı (Örn: X):");
                if (!name) return;
                let url = prompt("URL (Örn: x.com):");
                if (!url) return;
                if (!url.startsWith('http')) url = 'https://' + url;
                shortcuts.push({ name, url });
                localStorage.setItem('brox_shortcuts', JSON.stringify(shortcuts));
                renderShortcuts();
                showToast("Kısayol eklendi");
            };
            shortcutGrid.appendChild(addDiv);
        }

        // Sekme Yönetimi
        let tabs = [{ id: 1, url: '', title: 'Yeni Sekme' }];
        let activeTabId = 1;

        function renderTabs() {
            tabCounterBtn.innerText = tabs.length;
            const container = document.getElementById('tab-grid-container');
            container.innerHTML = '';
            tabs.forEach(tab => {
                const card = document.createElement('div');
                card.className = `tab-card ${tab.id === activeTabId ? 'active' : ''}`;
                card.innerHTML = `<span>${tab.title}</span><div class="close-tab-btn" onclick="event.stopPropagation(); closeTab(${tab.id})">✖</div>`;
                card.onclick = () => switchTab(tab.id);
                container.appendChild(card);
            });
        }

        function loadUrl(inputUrl) {
            if(!inputUrl) return;
            let finalUrl = inputUrl.trim();
            if (!finalUrl.startsWith('http://') && !finalUrl.startsWith('https://')) {
                finalUrl = (finalUrl.includes('.') && !finalUrl.includes(' ')) ? 'https://' + finalUrl : 'https://www.google.com/search?q=' + encodeURIComponent(finalUrl);
            }
            urlInput.value = finalUrl;
            homeContent.style.display = 'none';
            backBtn.style.display = 'block';

            if (window.BroxNative && window.BroxNative.loadUrl) {
                window.BroxNative.loadUrl(finalUrl);
            }

            const t = tabs.find(t => t.id === activeTabId);
            if(t) { t.url = finalUrl; t.title = finalUrl.split('/')[2] || finalUrl; }
        }

        window.updateAddressBar = function(url) {
            urlInput.value = url;
            backBtn.style.display = 'block';
            homeContent.style.display = 'none';
            const t = tabs.find(t => t.id === activeTabId);
            if(t) { t.url = url; t.title = url.split('/')[2] || url; }
        };

        window.resetBrowser = function() {
            homeContent.style.display = 'flex';
            backBtn.style.display = 'none';
            urlInput.value = '';
            renderShortcuts();
            const t = tabs.find(t => t.id === activeTabId);
            if(t) { t.url = ''; t.title = 'Yeni Sekme'; }
        };

        function createNewTab() {
            const newId = Date.now();
            tabs.push({ id: newId, url: '', title: 'Yeni Sekme' });
            switchTab(newId);
        }

        function switchTab(id) {
            activeTabId = id;
            const tab = tabs.find(t => t.id === id);
            urlInput.value = tab.url;
            tabsModal.style.display = 'none';
            renderTabs();
            if(tab.url) {
                loadUrl(tab.url);
            } else {
                if (window.BroxNative && window.BroxNative.hideWebView) window.BroxNative.hideWebView();
                window.resetBrowser();
            }
        }

        function closeTab(id) {
            tabs = tabs.filter(t => t.id !== id);
            if(tabs.length === 0) createNewTab();
            else if(activeTabId === id) switchTab(tabs[tabs.length-1].id);
            renderTabs();
        }

        addTabBtn.onclick = () => createNewTab();
        tabCounterBtn.onclick = () => { tabsModal.style.display = 'flex'; renderTabs(); };
        document.getElementById('close-tabs-modal').onclick = () => { tabsModal.style.display = 'none'; };

        urlInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') { urlInput.blur(); loadUrl(urlInput.value); } });
        
        document.getElementById('home-btn').onclick = () => {
            if (window.BroxNative && window.BroxNative.hideWebView) window.BroxNative.hideWebView();
            window.resetBrowser();
        };

        backBtn.onclick = () => {
            if (window.BroxNative && window.BroxNative.goBack) {
                window.BroxNative.goBack();
            }
        };

        renderShortcuts();
        renderTabs();
    </script>
</body>
</html>
