<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Brox Browser</title>
    <style>
        :root { --bg-base: #000000; --bg-surface: #141414; --bg-hover: #222222; --text-main: #D0D0D0; --text-muted: #8A8A8A; --border: #2E2E2E; --incognito: #0A0A0A; } 
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; background-color: var(--bg-base); color: var(--text-main); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; overflow: hidden; -webkit-user-select: none; user-select: none; } 

        #toolbar { display: flex; align-items: center; padding: 0 8px; height: 52px; gap: 6px; background-color: var(--bg-base); border-bottom: 1px solid var(--border); z-index: 20; flex-shrink: 0; transition: transform 0.3s ease; }
        body.incognito #toolbar { background-color: var(--incognito); }
        body.fullscreen-mode #toolbar { display: none !important; }
        #home-toolbar-btn { display: none; }

        .input-container { display: flex; flex-grow: 1; align-items: center; background-color: var(--bg-surface); border: 1px solid var(--border); border-radius: 8px; padding: 0 10px; height: 36px; }
        #url-input { flex-grow: 1; background: transparent; border: none; color: var(--text-main); font-size: 14px; outline: none; width: 100%; -webkit-user-select: auto; user-select: auto; }
        #url-input::placeholder { color: var(--text-muted); }

        .icon-btn { background: none; border: none; color: var(--text-main); display: flex; align-items: center; justify-content: center; width: 34px; height: 34px; cursor: pointer; border-radius: 8px; flex-shrink: 0; }
        .icon-btn:hover { background-color: var(--bg-hover); }
        .icon-btn svg { width: 18px; height: 18px; stroke-width: 1.8; stroke: var(--text-muted); } 

        #tab-counter-btn { border: 2px solid var(--text-muted); border-radius: 6px; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; color: var(--text-muted); cursor: pointer; flex-shrink: 0; margin: 0 2px; } 

        .dropdown-menu { display: none; position: absolute; background-color: var(--bg-surface); border: 1px solid var(--border); border-radius: 12px; flex-direction: column; width: 220px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); z-index: 50; padding: 6px 0; max-height: 400px; overflow-y: auto; }
        #dropdown-menu { top: 56px; right: 10px; width: 230px; }
        #tabs-menu { top: 55px; right: 46px; width: 190px; }

        .menu-item { padding: 11px 14px; color: var(--text-muted); cursor: pointer; display: flex; align-items: center; gap: 12px; font-size: 13px; background: none; border: none; width: 100%; text-align: left; transition: 0.15s; }
        .menu-item:hover { background-color: var(--bg-hover); color: var(--text-main); }
        .menu-item svg { width: 16px; height: 16px; stroke: var(--text-muted); stroke-width: 1.8; fill: none; flex-shrink: 0; }
        .menu-item:hover svg { stroke: var(--text-main); }
        .menu-divider { height: 1px; background-color: var(--border); margin: 4px 0; }

        #home-content { flex-grow: 1; padding: 24px 16px; overflow-y: auto; display: flex; flex-direction: column; background: var(--bg-base); z-index: 10; }
        .shortcuts-title { font-size: 12px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 16px; }
        .shortcut-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 20px; }
        .shortcut-item { display: flex; flex-direction: column; align-items: center; cursor: pointer; position: relative; }
        .shortcut-icon { width: 56px; height: 56px; background-color: var(--bg-surface); border: 1px solid var(--border); border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; color: var(--text-main); transition: 0.2s; }
        .shortcut-item:hover .shortcut-icon { border-color: var(--text-main); background-color: var(--bg-hover); }
        .shortcut-name { margin-top: 6px; font-size: 11px; color: var(--text-muted); width: 100%; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .pinned-badge { position: absolute; top: -3px; right: 3px; font-size: 9px; color: var(--text-main); background: var(--bg-hover); border-radius: 50%; width: 15px; height: 15px; display: flex; align-items: center; justify-content: center; border: 1px solid var(--border); }

        #tabs-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.88); z-index: 60; backdrop-filter: blur(10px); flex-direction: column; padding: 16px; box-sizing: border-box; }
        .tabs-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; font-size: 17px; font-weight: 500; color: var(--text-main); position: relative; }
        .tabs-header-right { display: flex; align-items: center; gap: 12px; }
        .tab-grid { display: flex; flex-wrap: wrap; gap: 10px; overflow-y: auto; flex-grow: 1; }
        .tab-card { background-color: var(--bg-surface); border: 1px solid var(--border); border-radius: 10px; width: calc(50% - 5px); height: 120px; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; position: relative; transition: transform 0.2s; }
        .tab-card.active { border-color: var(--text-main); }
        .tab-card span { font-size: 12px; text-align: center; padding: 8px; word-break: break-all; color: var(--text-muted); }
        .tab-card input[type="checkbox"] { position: absolute; top: 8px; left: 8px; display: none; }
        .tab-card.select-mode input[type="checkbox"] { display: block; }
        .close-tab-btn { position: absolute; top: 5px; right: 5px; background: var(--bg-hover); color: var(--text-muted); border-radius: 50%; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; font-size: 10px; }

        #selection-toolbar { display: none; position: absolute; bottom: 0; left: 0; width: 100%; background: var(--bg-surface); border-top: 1px solid var(--border); padding: 12px 20px; justify-content: space-around; z-index: 65; }
        .sel-btn { background: none; border: none; color: var(--text-main); font-size: 13px; cursor: pointer; padding: 6px 12px; border-radius: 6px; background-color: var(--bg-hover); }

        #settings-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.92); z-index: 70; backdrop-filter: blur(10px); flex-direction: column; padding: 20px; box-sizing: border-box; overflow-y: auto; }
        .settings-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; font-size: 18px; font-weight: 500; color: var(--text-main); }
        .setting-section-title { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin: 16px 0 6px 0; }
        .setting-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 13px; color: var(--text-main); }
        .setting-desc { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
        .setting-select, .setting-input { background: var(--bg-surface); color: var(--text-main); border: 1px solid var(--border); padding: 5px 10px; border-radius: 6px; outline: none; font-size: 12px; max-width: 150px; }
        
        .switch { position: relative; display: inline-block; width: 40px; height: 22px; flex-shrink: 0; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: var(--border); transition: .3s; border-radius: 22px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: var(--text-main); transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: #555; }
        input:checked + .slider:before { transform: translateX(18px); }

        #shortcut-menu-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.85); z-index: 80; backdrop-filter: blur(10px); align-items: center; justify-content: center; padding: 20px; }
        .shortcut-menu-box { background-color: var(--bg-surface); border: 1px solid var(--border); border-radius: 14px; width: 100%; max-width: 300px; display: flex; flex-direction: column; overflow: hidden; padding: 6px 0; }
        .shortcut-menu-item { padding: 12px 18px; color: var(--text-main); font-size: 14px; cursor: pointer; background: none; border: none; text-align: left; transition: 0.15s; }
        .shortcut-menu-item:hover { background-color: var(--bg-hover); }
        .shortcut-menu-item.danger { color: #B0B0B0; }

        #toast { visibility: hidden; min-width: 180px; background-color: var(--bg-surface); border: 1px solid var(--border); color: var(--text-main); text-align: center; border-radius: 10px; padding: 8px 14px; position: fixed; z-index: 100; left: 50%; bottom: 24px; transform: translateX(-50%); font-size: 12px; opacity: 0; transition: opacity 0.3s; }
        #toast.show { visibility: visible; opacity: 1; }
    </style>
</head>
<body> 
    <div id="toolbar">
        <button class="icon-btn" id="home-toolbar-btn" title="Ana Sayfa"><svg viewBox="0 0 24 24" fill="none"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg></button>

    <div id="toast"></div> 

    <script>
        const urlInput = document.getElementById('url-input');
        const homeContent = document.getElementById('home-content');
        const homeToolbarBtn = document.getElementById('home-toolbar-btn');
        const addTabBtn = document.getElementById('add-tab-btn');
        const tabCounterBtn = document.getElementById('tab-counter-btn');
        const menuBtn = document.getElementById('menu-btn');
        const tabsMenuBtn = document.getElementById('tabs-menu-btn');
        const dropdownMenu = document.getElementById('dropdown-menu');
        const tabsMenu = document.getElementById('tabs-menu');
        const tabsModal = document.getElementById('tabs-modal');
        const settingsModal = document.getElementById('settings-modal');
        const shortcutModal = document.getElementById('shortcut-menu-modal');
        const shortcutGrid = document.getElementById('shortcut-grid');
        const selectionToolbar = document.getElementById('selection-toolbar');
        
        const searchEngineSelect = document.getElementById('search-engine-select');
        const customEngineRow = document.getElementById('custom-engine-row');
        const customEngineInput = document.getElementById('custom-engine-input');
        const screenshotToggle = document.getElementById('screenshot-toggle');

        let isFullscreen = false;

        function showToast(msg) {
            const t = document.getElementById("toast"); t.innerText = msg;
            t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 2500);
        }

        // 1. İSTEDİĞİN MADDE: Sayfadaki herhangi bir boşluğa (veya içeriğe) tıklandığında menüler kapatılsın
        window.onclick = (e) => {
            if (!dropdownMenu.contains(e.target) && e.target !== menuBtn && !menuBtn.contains(e.target)) dropdownMenu.style.display = 'none';
            if (!tabsMenu.contains(e.target) && e.target !== tabsMenuBtn && !tabsMenuBtn.contains(e.target)) tabsMenu.style.display = 'none';
        };

        // 2. İSTEDİĞİN MADDE: Anasayfada veya herhangi bir sekmede menü butonunun kusursuz açılıp kapanması
        menuBtn.onclick = (e) => { 
            e.stopPropagation(); 
            dropdownMenu.style.display = dropdownMenu.style.display === 'flex' ? 'none' : 'flex'; 
            tabsMenu.style.display = 'none'; 
        };
        
        tabsMenuBtn.onclick = (e) => { 
            e.stopPropagation(); 
            tabsMenu.style.display = tabsMenu.style.display === 'flex' ? 'none' : 'flex'; 
            dropdownMenu.style.display = 'none'; 
        };

        let shortcuts = JSON.parse(localStorage.getItem('brox_shortcuts')) || [
            { name: "Google", url: "https://www.google.com", pinned: true },
            { name: "YouTube", url: "https://www.youtube.com", pinned: true },
            { name: "Wikipedia", url: "https://www.wikipedia.org", pinned: false }
        ];
        let selectedShortcutIndex = null;
        let isSelectMode = false;

        function renderShortcuts() {
            shortcutGrid.innerHTML = '';
            shortcuts.sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0));
            shortcuts.forEach((item, index) => {
                let div = document.createElement('div'); div.className = 'shortcut-item';
                div.innerHTML = `<div class="shortcut-icon">${item.name.charAt(0).toUpperCase()}</div>${item.pinned ? '<div class="pinned-badge">•</div>' : ''}<div class="shortcut-name">${item.name}</div>`;
                div.onclick = () => processAndLoad(item.url);
                div.oncontextmenu = (e) => { e.preventDefault(); openShortcutMenu(index); };
                let pressTimer;
                div.ontouchstart = () => { pressTimer = setTimeout(() => openShortcutMenu(index), 600); };
                div.ontouchend = () => { clearTimeout(pressTimer); };
                shortcutGrid.appendChild(div);
            });
            let addDiv = document.createElement('div'); addDiv.className = 'shortcut-item';
            addDiv.innerHTML = `<div class="shortcut-icon" style="font-size:24px;">+</div><div class="shortcut-name">Ekle</div>`;

        // 3. İSTEDİĞİN MADDE: Arama ve yükleme fonksiyonu (Anasayfada ve sekmelerde kusursuz)
        function processAndLoad(inputVal) {
            if(!inputVal) return;
            let query = inputVal.trim();
            let finalUrl = query;
            let engine = localStorage.getItem('brox_engine') || 'https://www.google.com/search?q=';

            if (!finalUrl.startsWith('http://') && !finalUrl.startsWith('https://')) {
                if (finalUrl.includes('.') && !finalUrl.includes(' ') && !finalUrl.startsWith('localhost')) finalUrl = 'https://' + finalUrl;
                else finalUrl = engine + encodeURIComponent(query);
            }

            urlInput.value = finalUrl; 
            homeContent.style.display = 'none';
            
            if (window.BroxNative && window.BroxNative.loadUrl) window.BroxNative.loadUrl(finalUrl);
            
            const t = tabs.find(t => t.id === activeTabId);
            if(t) { t.url = finalUrl; t.title = finalUrl.split('/')[2] || finalUrl; }
        }
        
        window.handleLinkClick = function(url) { if(url) processAndLoad(url); };
        
        window.resetBrowser = function() { 
            homeContent.style.display = 'flex'; 
            urlInput.value = ''; 
            renderShortcuts(); 
            const t = tabs.find(t => t.id === activeTabId); 
            if(t) { t.url = ''; t.title = t.incognito ? 'Gizli Sekme' : 'Yeni Sekme'; } 
        };

        function createNewTab(isIncognito = false) { const newId = Date.now(); tabs.push({ id: newId, url: '', title: isIncognito ? 'Gizli Sekme' : 'Yeni Sekme', incognito: isIncognito }); switchTab(newId); }
        function switchTab(id) {
            activeTabId = id; const tab = tabs.find(t => t.id === id); urlInput.value = tab.url; tabsModal.style.display = 'none'; isSelectMode = false; renderTabs();
            if(tab.incognito) document.body.classList.add('incognito'); else document.body.classList.remove('incognito');
            
            if(tab.url) { 
                homeContent.style.display = 'none';
                if (window.BroxNative && window.BroxNative.loadUrl) window.BroxNative.loadUrl(tab.url);
            } else { 
                if (window.BroxNative && window.BroxNative.hideWebView) window.BroxNative.hideWebView(); 
                window.resetBrowser(); 
            }
        }
        function closeTab(id) { tabs = tabs.filter(t => t.id !== id); if(tabs.length === 0) createNewTab(); else if(activeTabId === id) switchTab(tabs[tabs.length-1].id); renderTabs(); }

        document.getElementById('m-refresh').onclick = () => { dropdownMenu.style.display = 'none'; if (window.BroxNative && window.BroxNative.reload) window.BroxNative.reload(); showToast("Sayfa yenileniyor"); };

        urlInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') { urlInput.blur(); processAndLoad(urlInput.value); } });
        addTabBtn.onclick = () => createNewTab(false);

        document.getElementById('close-tabs-modal').onclick = () => { tabsModal.style.display = 'none'; isSelectMode = false; };
        homeToolbarBtn.onclick = () => { if (window.BroxNative && window.BroxNative.hideWebView) window.BroxNative.hideWebView(); window.resetBrowser(); };

        renderShortcuts(); renderTabs();

        // BROX-NATIVE-BRIDGE: gerçek WebView ile arayüz arasındaki bağlantılar
        window.onNativeNav = function(url, title) {
            if (!url || url === 'about:blank') return;
            if (document.activeElement !== urlInput) urlInput.value = url;
            const t = tabs.find(t => t.id === activeTabId);
            if (t) { t.url = url; t.title = title || url.split('/')[2] || url; }
        };
        window.exitFullscreen = function() {
            isFullscreen = false; document.body.classList.remove('fullscreen-mode');
        };
        (function() {
            const overlays = ['dropdown-menu', 'tabs-menu', 'tabs-modal', 'settings-modal', 'shortcut-menu-modal'].map(id => document.getElementById(id));
            let last = false;
            function check() {
                const open = overlays.some(el => getComputedStyle(el).display !== 'none');
                if (open !== last) {
                    last = open;
                    if (window.BroxNative && window.BroxNative.setOverlayOpen) window.BroxNative.setOverlayOpen(open);
                }
            }
            const obs = new MutationObserver(check);
            overlays.forEach(el => obs.observe(el, { attributes: true, attributeFilter: ['style'] }));
        })();

        // BROX-STEP3: sekme yöneticisi menüsü + Ayarlar > Genel
        (function () {
            try {
                const st = document.createElement('style');
                st.textContent = `
                #tabs-menu { top: 56px; right: 16px; width: 240px; z-index: 90; }

        // --- Sekme yöneticisi: üç nokta menüsü, seçim, kaydırarak kapatma ---
        (function () {
            try {
                const tmSelect = document.getElementById('tm-select-mode');
                tabsMenu.insertAdjacentHTML('beforeend',
                    '<button class="menu-item" id="tm-sel-close" style="display:none;">Seçilen sekmeleri kapat</button>' +
                    '<button class="menu-item" id="tm-sel-incognito" style="display:none;">Seçilen sekmeleri gizli sekme olarak aç</button>');
                const tmSelClose = document.getElementById('tm-sel-close');
                const tmSelIncog = document.getElementById('tm-sel-incognito');
                let idCounter = 0;
                const newId = () => Date.now() * 1000 + (idCounter++ % 1000);

                function selectedIds() {
                    return Array.from(document.querySelectorAll('#tab-grid-container .tab-card input[type="checkbox"]:checked'))
                        .map(c => Number(c.dataset.id));
                }
                function updateTabsMenuItems() {
                    const n = isSelectMode ? selectedIds().length : 0;
                    tmSelClose.style.display = n > 0 ? 'flex' : 'none';
                    tmSelIncog.style.display = n > 0 ? 'flex' : 'none';
                    tmSelect.textContent = isSelectMode ? 'Seçimden çık' : 'Seç';
                }

                function enhanceTabCards() {
                    const cards = document.querySelectorAll('#tab-grid-container .tab-card');
                    cards.forEach((card, i) => {
                        const tab = tabs[i];
                        if (!tab) return;
                        let startX = 0, startY = 0, dx = 0, swiping = false;
                        card.ontouchstart = (e) => {
                            startX = e.touches[0].clientX; startY = e.touches[0].clientY;
                            dx = 0; swiping = false; card.style.transition = 'none';
                        };
                        card.ontouchmove = (e) => {
                            const x = e.touches[0].clientX - startX;
                            const y = e.touches[0].clientY - startY;
                            if (!swiping && Math.abs(x) > 10 && Math.abs(x) > Math.abs(y)) swiping = true;
                            if (!swiping) return;
                            dx = x;
                            card.style.transform = 'translateX(' + dx + 'px)';
                            card.style.opacity = String(1 - Math.min(Math.abs(dx) / 200, 0.8));
                        };
                        card.ontouchend = () => {
                            card.style.transition = 'transform 0.2s ease, opacity 0.2s ease';
                            if (swiping && Math.abs(dx) > 100) {
                                card.style.transform = 'translateX(' + (dx > 0 ? '110%' : '-110%') + ')';
                                card.style.opacity = '0';
                                setTimeout(() => closeTab(tab.id), 180);
                            } else {
                                card.style.transform = 'translateX(0)';
                                card.style.opacity = '1';
                            }
                            if (swiping) { card.dataset.swiped = '1'; setTimeout(() => { delete card.dataset.swiped; }, 60); }
                        };
                        const origClick = card.onclick;
                        card.onclick = (e) => {
                            if (card.dataset.swiped) return;
                            if (origClick) origClick.call(card, e);
                            updateTabsMenuItems();
                        };
                        const cb = card.querySelector('input[type="checkbox"]');
                        if (cb) cb.onclick = (e) => { e.stopPropagation(); updateTabsMenuItems(); };
                    });
                }

                const origRenderTabs = renderTabs;
                renderTabs = function () {
                    origRenderTabs();
                    selectionToolbar.style.display = 'none';
                    enhanceTabCards();
                    updateTabsMenuItems();
                };

                // Sekme yöneticisi açıkken bir sekme kapatılınca yönetici kapanmasın
                const origCloseTab = closeTab;
                closeTab = function (id) {
                    const modalOpen = tabsModal.style.display === 'flex';
                    origCloseTab(id);
                    if (modalOpen) { tabsModal.style.display = 'flex'; renderTabs(); }
                };

                tmSelect.onclick = () => { isSelectMode = !isSelectMode; tabsMenu.style.display = 'none'; renderTabs(); };

                tmSelClose.onclick = () => {
                    const ids = selectedIds();
                    tabsMenu.style.display = 'none';
                    if (!ids.length) return;
                    const wasActive = ids.includes(activeTabId);
                    const wasOpen = tabsModal.style.display === 'flex';
                    tabs = tabs.filter(t => !ids.includes(t.id));
                    isSelectMode = false;
                    if (tabs.length === 0) createNewTab();
                    else if (wasActive) { switchTab(tabs[tabs.length - 1].id); if (wasOpen) tabsModal.style.display = 'flex'; }
                    renderTabs();
                };

                tmSelIncog.onclick = () => {
                    const ids = selectedIds();
                    tabsMenu.style.display = 'none';
                    if (!ids.length) return;
                    ids.forEach(id => {
                        const t = tabs.find(i => i.id === id);
                        if (!t) return;
                        tabs.push({ id: newId(), url: t.url, title: t.url ? t.title : 'Gizli Sekme', incognito: true });
                    });
                    isSelectMode = false;
                    renderTabs();
                    showToast(ids.length + ' gizli sekme açıldı');
                };

                renderTabs();
            } catch (e) { console.log('Brox sekme hatasi', e); }
        })();

        // --- Ayarlar > Genel: arama motorları, karşılama ekranı, yeni sekme sayfası ---
        (function () {
            try {
                const BUILTIN = [
                    ['Google (Varsayılan)', 'https://www.google.com/search?q='],
                    ['Yandex', 'https://yandex.com/search/?text='],
                    ['DuckDuckGo', 'https://duckduckgo.com/?q='],
                    ['Bing', 'https://www.bing.com/search?q='],
                    ['Brox Engine', 'http://localhost:3000/search?q=']
                ];
                const DEFAULT_ENGINE = BUILTIN[0][1];
                const loadCustom = () => {
                    try { const a = JSON.parse(localStorage.getItem('brox_engines_custom')); return Array.isArray(a) ? a : []; }
                    catch (e) { return []; }
                };
                const saveCustom = (a) => localStorage.setItem('brox_engines_custom', JSON.stringify(a));
                const currentEngine = () => localStorage.getItem('brox_engine') || DEFAULT_ENGINE;
                const normalizeUrl = (u) => { u = u.trim(); return /^https?:\/\//i.test(u) ? u : 'https://' + u; };

                const oldRow = document.getElementById('custom-engine-row');
                if (oldRow) oldRow.remove();

                const engineRow = searchEngineSelect.closest('.setting-row');
                engineRow.insertAdjacentHTML('afterend',
                    '<div class="setting-box" id="engine-add-box" style="display:none;">' +
                        '<input type="text" id="eng-name" class="setting-input wide" placeholder="Arama motoru adı (örn: Ecosia)">' +
                        '<input type="text" id="eng-url" class="setting-input wide" placeholder="URL şablonu">' +
                        '<div class="setting-desc">Arama kelimesinin geleceği yere kadar yazın. Örn: https://www.ecosia.org/search?q=</div>' +
                        '<button class="sel-btn" id="eng-add">Ekle</button>' +
                    '</div>' +
                    '<div id="engine-custom-list"></div>' +
                    '<div class="setting-row"><div><div>Karşılama Ekranı</div><div class="setting-desc">Uygulama açıldığında gösterilecek sayfa</div></div>' +
                        '<select id="welcome-mode" class="setting-select"><option value="shortcuts">Kısayol ekranı</option><option value="url">URL</option></select></div>' +
                    '<div class="setting-subrow" id="welcome-url-row" style="display:none;"><input type="text" id="welcome-url" class="setting-input wide" placeholder="https://site.com"></div>' +
                    '<div class="setting-row"><div><div>Yeni Sekme Sayfası</div><div class="setting-desc">Yeni sekme açıldığında gösterilecek sayfa</div></div>' +
                        '<select id="newtab-mode" class="setting-select"><option value="shortcuts">Kısayol ekranı</option><option value="url">URL</option></select></div>' +
                    '<div class="setting-subrow" id="newtab-url-row" style="display:none;"><input type="text" id="newtab-url" class="setting-input wide" placeholder="https://site.com"></div>');

                const addBox = document.getElementById('engine-add-box');
                const nameIn = document.getElementById('eng-name');
                const urlIn = document.getElementById('eng-url');
                const listEl = document.getElementById('engine-custom-list');

                function renderEngines() {
                    const custom = loadCustom();
                    const all = BUILTIN.concat(custom.map(c => [c.name, c.url]));
                    const cur = currentEngine();
                    if (!all.some(e => e[1] === cur)) all.push(['Kayıtlı özel motor', cur]);
                    searchEngineSelect.innerHTML = '';
                    all.forEach(e => {
                        const o = document.createElement('option');
                        o.value = e[1]; o.textContent = e[0];
                        searchEngineSelect.appendChild(o);
                    });
                    const add = document.createElement('option');
                    add.value = '__add__'; add.textContent = 'Manuel Ekle...';
                    searchEngineSelect.appendChild(add);
                    searchEngineSelect.value = cur;

                    listEl.innerHTML = '';
                    custom.forEach((c, i) => {
                        const item = document.createElement('div'); item.className = 'engine-item';
                        const info = document.createElement('div');
                        info.textContent = c.name;
                        const small = document.createElement('small'); small.textContent = c.url;
                        info.appendChild(small);
                        const del = document.createElement('button'); del.className = 'engine-del'; del.textContent = '×';
                        del.onclick = () => {
                            const arr = loadCustom(); const removed = arr.splice(i, 1)[0]; saveCustom(arr);
                            if (removed && removed.url === currentEngine()) localStorage.setItem('brox_engine', DEFAULT_ENGINE);
                            renderEngines(); showToast('Arama motoru silindi');
                        };
                        item.appendChild(info); item.appendChild(del);
                        listEl.appendChild(item);
                    });
                }

                searchEngineSelect.onchange = () => {
                    if (searchEngineSelect.value === '__add__') {
                        addBox.style.display = 'flex';
                        searchEngineSelect.value = currentEngine();
                        return;
                    }
                    localStorage.setItem('brox_engine', searchEngineSelect.value);
                    addBox.style.display = 'none';
                    showToast('Arama motoru güncellendi');
                };

                document.getElementById('eng-add').onclick = () => {
                    const name = nameIn.value.trim();
                    const raw = urlIn.value.trim();
                    if (!name || !raw) { showToast('Ad ve URL gerekli'); return; }
                    const url = normalizeUrl(raw);

                }
                bindSwitch('ab-https', 'brox_ab_https', true);
                bindSwitch('ab-translate-sw', 'brox_ab_translate', false);
                bindSwitch('ab-reader-sw', 'brox_ab_reader', false);
                const homeRow = document.getElementById('ab-home-url-row');
                const homeUrlIn = document.getElementById('ab-home-url');
                bindSwitch('ab-home', 'brox_ab_home', false, (on) => { homeRow.style.display = on ? 'block' : 'none'; });
                homeRow.style.display = flag('brox_ab_home', false) ? 'block' : 'none';
                homeUrlIn.value = ls.getItem('brox_ab_home_url') || '';
                homeUrlIn.onchange = () => {
                    let v = homeUrlIn.value.trim();
                    if (v) v = normalizeUrl(v);
                    homeUrlIn.value = v;
                    ls.setItem('brox_ab_home_url', v);
                    showToast(v ? 'Ana sayfa adresi kaydedildi' : 'Ana sayfa: kısayol ekranı');
                };
                bindSwitch('force-dark', 'brox_force_dark', false, (on) => { nat('setForceDark', on, true); });
                bindSwitch('force-zoom', 'brox_force_zoom', false, (on) => { nat('setForceZoom', on); });
                const langSel = document.getElementById('translate-lang');
                langSel.value = ls.getItem('brox_translate_lang') || 'tr';
                langSel.onchange = () => { ls.setItem('brox_translate_lang', langSel.value); };

                // Karanlık tema / yakınlaştırma ayarlarını açılışta uygula (sayfayı yeniden yüklemeden)
                setTimeout(() => {
                    if (flag('brox_force_dark', false)) nat('setForceDark', true, false);
                    if (flag('brox_force_zoom', false)) nat('setForceZoom', true);
                    updateToolbar();
                }, 300);
                updateToolbar();

                // ---------- Düğmelerin işlevleri ----------
                homeToolbarBtn.onclick = () => {
                    const u = ls.getItem('brox_ab_home_url') || '';
                    if (u) { processAndLoad(u); return; }
                    const t = tabs.find(x => x.id === activeTabId);
                    if (t) { t.url = ''; t.title = t.incognito ? 'Gizli Sekme' : 'Yeni Sekme'; }
                    nat('hideWebView');
                    window.resetBrowser();
                };
                shortcutBtn.onclick = () => {
                    const map = { refresh: 'm-refresh', save: 'm-save', tts: 'm-tts' };
                    const id = map[ls.getItem('brox_tb_shortcut') || 'none'];
                    if (id) document.getElementById(id).onclick();
                };
                readerEl.onclick = () => document.getElementById('m-reader').onclick();

                function translatePage() {
                    const t = tabs.find(x => x.id === activeTabId);
                    const u = (t && t.url) || '';
                    if (!/^https?:\/\//i.test(u)) { showToast('Önce bir sayfa açın'); return; }
                    if (/\.translate\.goog|translate\.google\./i.test(u)) { showToast('Bu sayfa zaten çevrilmiş'); return; }
                    const lang = ls.getItem('brox_translate_lang') || 'tr';
                    processAndLoad('https://translate.google.com/translate?sl=auto&tl=' + lang + '&u=' + encodeURIComponent(u));
                }
                translateEl.onclick = translatePage;
                document.getElementById('m-translate').onclick = () => { dropdownMenu.style.display = 'none'; translatePage(); };

                document.getElementById('m-tts').onclick = () => {
                    dropdownMenu.style.display = 'none';
                    if (getComputedStyle(homeContent).display !== 'none') { showToast('Önce bir sayfa açın'); return; }
                    nat('speakPage', '(' + broxExtractText.toString() + ')()');
                };
            } catch (e) { console.log('Brox adim6 hatasi', e); }
        })();
    </script>
</body>
</html>
